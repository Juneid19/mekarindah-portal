<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mekarindah Portal — Portal Warga</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-brand"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg></div>
  <div class="loading-spinner"></div>
  <p>Menyiapkan portal warga…</p>
</div>

<div id="app" class="app-shell" style="display:none">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg></div>
      <div><strong>MEKARINDAH</strong><span>PORTAL WARGA</span></div>
      <button class="close-sidebar" id="close-sidebar" aria-label="Tutup menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <nav>
      <p class="nav-label">MENU UTAMA</p>
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Beranda</span></button>
      <button class="nav-item" data-view="profile"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil Saya</span></button>
      <button class="nav-item" data-view="property"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Properti</span></button>
      <button class="nav-item" data-view="ipl"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg><span>Tagihan IPL</span></button>
      <button class="nav-item" data-view="access"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Kartu Akses</span></button>
      <button class="nav-item" data-view="finance"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg><span>Laporan Keuangan</span></button>
      <button class="nav-item" data-view="vehicles"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14M3 11l2-6h14l2 6M5 17a2 2 0 104 0M15 17a2 2 0 104 0M3 11h18v4H3z"/></svg><span>Kendaraan</span></button>
      <p class="nav-label nav-label-spaced">LAYANAN</p>
      <button class="nav-item" data-view="documents"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Permintaan Dokumen</span></button>
      <button class="nav-item" data-view="arrears"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Penunggak IPL</span></button>
      <button class="nav-item" data-view="complaints"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18v3M12 13v8M17 8v13M22 12h-4l-3 9-6-18-3 9H2"/></svg><span>Aduan & SOS</span></button>
      <p class="nav-label nav-label-spaced">ADMINISTRATOR</p>
      <button class="nav-item" data-view="residents"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><span>Data Warga</span></button>
    </nav>
    <div class="sidebar-help">
      <div class="help-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0118 0v6M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3v5zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3v5z"/></svg></div>
      <div><strong>Butuh bantuan?</strong><span>Hubungi pengelola</span></div>
      <button id="call-help"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></button>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">BS</div>
      <div><strong id="user-name">Budi Santoso</strong><span>Penghuni • <span id="user-unit">A-01</span></span></div>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </div>
  </aside>

  <button class="backdrop" id="backdrop"></button>

  <!-- MAIN -->
  <main class="main-area">
    <header class="topbar">
      <button class="menu-button" id="menu-button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="crumb"><span>Portal Warga</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><strong id="crumb-title">Beranda</strong></div>
      <div class="top-actions">
        <button class="icon-button" id="reset-data" title="Reset semua data ke default">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <div class="profile-menu-wrap">
          <button class="profile-button" id="profile-button">
            <div class="avatar" id="top-avatar">BS</div>
            <div><strong id="top-name">Budi Santoso</strong><span id="top-unit">A-01</span></div>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal">
      <div class="modal-head">
        <div><h2 id="modal-title">Modal</h2><p id="modal-subtitle">Lengkapi data di bawah ini</p></div>
        <button id="modal-close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <form id="modal-form"></form>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" style="display:none">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-text"></span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
